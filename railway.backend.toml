[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"
watchPatterns = [
  "/backend/**",
  "/Dockerfile.backend",
  "/railway.backend.toml"
]

[deploy]
preDeployCommand = ["python -m alembic upgrade head"]
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
